[package]
name = "doa-rustcheck"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "doa-rustcheck"
path = "src/main.rs"

[lib]
name = "doa_rustcheck_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
hex = "=0.4.3"
rand = "=0.8.5"
