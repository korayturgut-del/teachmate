name: DÖA Release

on:
  push:
    tags: ['v*']

jobs:
  credential-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credential taraması
        run: bash tools/check-credentials.sh

  build-desktop:
    needs: credential-check
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build (Phase 4+)
        run: cd apps/desktop && npm run tauri build
        # Phase 1-3: skip (Tauri henüz sarmalanmadı)
        if: false

  deploy-cloud-brain:
    needs: credential-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: cd apps/cloud-brain && flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  qa-sign-off:
    needs: [build-desktop, deploy-cloud-brain]
    runs-on: ubuntu-latest
    steps:
      - name: QA Agent Final Check
        run: echo "QA checklist doğrulaması — Phase 5"
