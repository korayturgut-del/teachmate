<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>🧪 Dijital Test Maker — Dijital Öğretmen Asistanı</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../shared/css/design-system.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/enhance.css">
<link rel="stylesheet" href="css/dijital-test-maker.css">

<style>
#login-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0c12;background-image:radial-gradient(at 20% 30%,rgba(20,184,166,0.15)0px,transparent 50%),radial-gradient(at 80% 70%,rgba(56,168,216,0.1)0px,transparent 50%);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Inter',sans-serif}
.login-box{background:rgba(22,27,34,0.95);padding:50px 60px;border-radius:24px;border:1px solid rgba(255,255,255,0.08);text-align:center;box-shadow:0 25px 80px -12px rgba(0,0,0,0.7);backdrop-filter:blur(20px);max-width:420px;width:90%}
.login-box h1{font-size:56px;margin-bottom:8px}
.login-box h2{font-size:1.3rem;font-weight:700;margin-bottom:4px;background:linear-gradient(135deg,#fff 0%,#8b949e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box .login-sub{color:#8b949e;margin-bottom:30px;font-size:.85rem}
#main-app-content{display:none}
.ml-a{margin-left:auto}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>🧪</h1>
    <h2>Dijital Test Maker</h2>
    <p class="login-sub">Hızlı soru hazırlama ve test oluşturma</p>
    <div id="g_id_onload" data-client_id="382416473789-4ar84tn08cjbvf2o30bkqu3fl97jmsem.apps.googleusercontent.com" data-context="signin" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
        <div style="margin-top:14px;text-align:center">
      <button onclick="directLogin()" style="background:transparent;border:1px dashed rgba(255,255,255,0.15);color:rgba(255,255,255,0.35);padding:7px 24px;border-radius:20px;cursor:pointer;font-size:.75rem;font-family:inherit;transition:all .2s" onmouseover="this.style.borderColor='rgba(255,255,255,0.4)';this.style.color='rgba(255,255,255,0.6)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='rgba(255,255,255,0.35)'">🔓 Doğrudan Giriş</button>
    </div>
        
    <div id="login-error" style="display:none;color:#ef4444;margin-top:12px;font-size:.8rem"></div>
  </div>
</div>

<div id="main-app-content">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <a href="../index.html" class="topbar-brand" style="text-decoration:none;color:var(--text)">🦋 Kelebek</a>
        <span style="color:var(--text3);margin:0 8px">›</span>
        <span class="topbar-page">🧪 Dijital Test Maker</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-sm" onclick="loadTestFromFile()">📂 Yükle</button>
        <button class="btn btn-ghost btn-sm" onclick="saveTestToFile()">💾 Kaydet</button>
        <button class="btn btn-ghost btn-sm" onclick="location.href='../index.html'">🏠 Hub</button>
      </div>
    </div>
  </div>

  <div class="dtm-page">
    <!-- Sidebar: Question List -->
    <div class="dtm-sidebar">
      <div class="qlist-actions">
        <button class="btn btn-primary btn-sm" onclick="addQuestion('mc')">➕ ÇS</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--green)" onclick="addQuestion('open')">📝 Açık Uçlu</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--purple)" onclick="addQuestion('fill')">✏️ Boşluk</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--amber)" onclick="addSection()">📌 Bölüm</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="clearAllQuestions()">🗑 Tümü</button>
      </div>
      <div class="qlist-total" id="total-pts">0 puan</div>
      <div class="q-empty" id="q-empty">
        <div style="font-size:2rem;margin-bottom:8px">📝</div>
        <div style="font-weight:600">Henüz soru yok</div>
        <div style="margin-top:4px">Yukarıdan soru ekleyin veya <b>Ctrl+V</b> ile hızlıca başlayın</div>
      </div>
      <div class="qlist-scroll" id="qlist-wrap"></div>
    </div>

    <!-- Main: Empty state -->
    <div class="dtm-main" id="dtm-main-stub" style="display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:1rem">
      <div style="text-align:center">
        <div style="font-size:3rem;margin-bottom:12px">🧪</div>
        <div>Soldan bir soru seçin veya yeni soru ekleyin</div>
        <div style="font-size:.75rem;margin-top:6px;opacity:.7"><kbd style="background:var(--bg2);padding:2px 6px;border-radius:4px;border:1px solid var(--border)">Ctrl+V</kbd> = Hızlı ÇS ekle</div>
      </div>
    </div>
  </div>

  <!-- ====== QUESTION EDIT PANEL ====== -->
  <div class="qedit-panel" id="qedit-panel">
    <div class="qedit-header">
      <span class="qedit-title" id="qedit-title"></span>
      <div class="qedit-nav" style="display:flex;gap:4px;align-items:center">
        <div style="display:flex;align-items:center;gap:4px;margin-right:10px">
          <label class="lbl" style="font-size:.7rem;margin-right:2px">Puan:</label>
          <input class="inp inp-sm" type="number" id="qedit-puan" min="0" max="100" step="1" value="5" onchange="qeditSavePuan()" style="width:55px;padding:4px 6px;font-size:.78rem">
        </div>
        <div style="display:flex;align-items:center;gap:4px;margin-right:10px">
          <label class="lbl" style="font-size:.7rem;margin-right:2px">Boşluk:</label>
          <input class="inp inp-sm" type="range" id="qedit-bosluk" min="0" max="12" step="1" value="0" oninput="document.getElementById('bosluk-val').textContent=this.value;qeditSaveBosluk()" style="width:70px">
          <span id="bosluk-val" style="font-size:.7rem;color:var(--text2);min-width:16px">0</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="qEditNav(-1)">◀ Önceki</button>
        <button class="btn btn-ghost btn-sm" onclick="qEditNav(1)">Sonraki ▶</button>
        <button class="btn btn-ghost btn-sm" onclick="closeQEdit()">✕ Kapat</button>
      </div>
    </div>
    <div class="qedit-inner">
      <div class="we-toolbar">
        <button class="we-btn" onclick="weExec('bold')"><b>B</b></button>
        <button class="we-btn" onclick="weExec('italic')"><i>İ</i></button>
        <button class="we-btn" onclick="weExec('underline')"><u>A</u></button>
        <button class="we-btn" onclick="weExec('strikeThrough')"><s>S</s></button>
        <span class="we-sep"></span>
        <button class="we-btn" onclick="weExec('subscript')">X₂</button>
        <button class="we-btn" onclick="weExec('superscript')">X²</button>
        <span class="we-sep"></span>
        <button class="we-btn" onclick="weExec('fontSize','11')">11pt</button>
        <button class="we-btn" onclick="weExec('fontSize','12')">12pt</button>
        <button class="we-btn" onclick="weExec('fontSize','14')">14pt</button>
        <span class="we-sep"></span>
        <button class="we-btn" onclick="weExec('insertUnorderedList')">• List</button>
        <button class="we-btn" onclick="weExec('insertOrderedList')">1. List</button>
      </div>
      <div class="we-tabs">
        <button class="we-tab on" id="we-tab-mat" onclick="weTabSwitch('mat',event)">📐 Matematik</button>
        <button class="we-tab" id="we-tab-fiz" onclick="weTabSwitch('fiz',event)">⚛️ Fizik</button>
        <button class="we-tab" id="we-tab-kim" onclick="weTabSwitch('kim',event)">🧪 Kimya</button>
      </div>
      <div id="we-sym-btns"></div>
      <div id="we-area" contenteditable="true" placeholder="Soruyu buraya yazın..." onfocus="weSave()" oninput="qeditSaveText()"></div>
      <div class="qedit-body" id="qedit-body"></div>
    </div>
  </div>

</div>

<script src="../shared/js/utils.js"></script>
<script src="../shared/js/auth-globals.js"></script>
<script src="../shared/js/student-cloud.js"></script>
<script src="../shared/js/sync.js"></script>
<script src="../shared/js/app-core.js"></script>
<script src="js/dijital-test-maker.js"></script>

</body>
</html>
